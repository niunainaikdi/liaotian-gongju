<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>简易聊天室</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial; max-width: 700px; margin: 30px auto; padding: 20px; background: #f5f5f5; }
        h1 { text-align: center; color: #2c3e50; }
        #login-box { background: white; padding: 20px; border-radius: 8px; text-align: center; }
        #login-box input { padding: 10px; width: 200px; border: 1px solid #ddd; border-radius: 5px; }
        #login-box button { padding: 10px 24px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #chat-box { display: none; background: white; border-radius: 8px; overflow: hidden; }
        #messages { height: 400px; overflow-y: auto; padding: 15px; background: #fafafa; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; background: #e8f4fd; word-wrap: break-word; }
        .msg.system { background: #fff3cd; color: #856404; font-size: 13px; text-align: center; }
        #input-area { display: flex; border-top: 1px solid #eee; }
        #input-area input { flex: 1; padding: 12px; border: none; outline: none; font-size: 14px; }
        #input-area button { padding: 12px 24px; background: #3498db; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>💬 简易聊天室</h1>

    <!-- 登录框 -->
    <div id="login-box">
        <input type="text" id="username" placeholder="输入你的昵称">
        <button onclick="joinChat()">进入聊天室</button>
    </div>

    <!-- 聊天框 -->
    <div id="chat-box">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message" placeholder="输入消息..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>

    <script>
        let ws = null;
        let username = "";

        function joinChat() {
            username = document.getElementById("username").value.trim();
            if (!username) return alert("请输入昵称");

            // 连接 WebSocket
            ws = new WebSocket(`ws://127.0.0.1:8000/ws/${username}`);

            ws.onopen = () => {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("chat-box").style.display = "block";
                document.getElementById("message").focus();
            };

            ws.onmessage = (event) => {
                const messages = document.getElementById("messages");
                const div = document.createElement("div");
                div.className = "msg" + (event.data.startsWith("系统") ? " system" : "");
                div.textContent = event.data;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
            };

            ws.onclose = () => {
                alert("连接已断开");
                location.reload();
            };
        }

        function sendMessage() {
            const input = document.getElementById("message");
            const text = input.value.trim();
            if (!text || !ws) return;
            ws.send(text);
            input.value = "";
        }
    </script>
</body>
</html>
